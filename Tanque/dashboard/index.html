<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Eater&display=swap" rel="stylesheet">
  <title>Monitoreo tanque</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Monitoreo - Tanque</h1>

  <div class="grid">



    

    <div class="card">
      <h2>Estado del tanque</h2>
      <p id="estado">MEDIO LLENO</p>
    </div>

    <div class="card">
      <h2>Porcentaje</h2>
      <p id="porcentaje">55%</p>
    </div>

    <div class="card">
      <h2>Lluvia</h2>
      <p id="lluvia">NO</p>
    </div>

    <div class="card">
      <h2>Distancia</h2>
      <p id="distancia">6 cm</p>
    </div>

    <div class="card">
      <h2>Duración ultrasonido</h2>
      <p id="duracion">1200 us</p>
    </div>

    <div class="card" id="graficaCard" style="max-width: 900px; margin: 20px auto; display:none;">
        <h2>📊 Nivel del tanque</h2>
        <canvas id="grafica"></canvas>
      </div>
      
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  </div>

  <script src="script.js"></script>

</body>
</html>
