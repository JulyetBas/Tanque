<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.google.com/specimen/Tapestry?preview.script=Latn" rel="stylesheet">
  <title>Monitoreo tanque</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Monitoreo - Tanque</h1>
  <div id="rain"></div>
  <div class="grid">



    <div class="card">
      <h2>Estado del tanque</h2>
      <p id="estado">MEDIO LLENO</p>
    </div>

    <div class="card">
      <h2>Porcentaje</h2>
      <p id="porcentaje">55%</p>
    </div>

    <div class="card">
      <h2>Lluvia</h2>
      <p id="lluvia">NO</p>
    </div>

    <div class="card">
      <h2>Distancia</h2>
      <p id="distancia">6 cm</p>
    </div>

    <div class="card" id="graficaCard" style="max-width: 900px; margin: 20px auto; display:none;">
        <h2>Grafica nivel del tanque</h2>
        <canvas id="grafica"></canvas>
      </div>
      
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  </div>
  <img class="lobo" src="imagenes/lobo.png">
  <script src="script.js"></script>

</body>
</html>
